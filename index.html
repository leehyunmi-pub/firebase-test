<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Firebase Login Test</title>
</head>
<body>
    <h1>내 첫 파이어베이스 로그인 페이지</h1>
    <button id="loginBtn">구글 로그인</button>
    <button id="logoutBtn" style="display:none;">로그아웃</button>
    <p id="userName">로그인이 필요합니다.</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 파이어베이스 콘솔에서 복사한 본인의 config를 여기에 넣으세요!
        const firebaseConfig = {
            apiKey: "본인의값",
            authDomain: "본인의값",
            projectId: "본인의값",
            storageBucket: "본인의값",
            messagingSenderId: "본인의값",
            appId: "본인의값"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const provider = new GoogleAuthProvider();

        // 버튼 연결 및 함수 작성 (위에서 드린 코드와 동일)
        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('userName').innerText = user.displayName + "님 안녕하세요!";
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
            } else {
                document.getElementById('userName').innerText = "로그인이 필요합니다.";
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'none';
            }
        });
    </script>
</body>
</html>
